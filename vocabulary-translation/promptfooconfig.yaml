description: Vocabulary translation

prompts:
  - file://prompts/system.txt

providers:
  - id: ollama:chat:gemma4:12b
    label: ollama-gemma4-12b
    config:
      think: false

defaultTest:
  assert:
    - type: is-json
      value:
        type: object
        required: [phrase, translation]
        properties:
          phrase:
            type: string
          grammar:
            type: [string, 'null']
          transcription:
            type: [string, 'null']
          translation:
            type: string
          notes:
            type: [string, 'null']
    
    - type: javascript
      value: file://assertions/validate-translation.js

tests:
  - file://generate-tests.js