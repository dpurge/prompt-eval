description: Vocabulary translation

prompts:
  - file://../prompt/default/system/generate-vocabulary-item.txt

providers:
  - id: ollama:chat:gemma4:12b
    label: ollama-gemma4-12b
    config:
      think: false
      # Same as phraseforge: the reply schema is sent as Ollama's "format"
      # (structured output), and the is-json assertion below checks the
      # same schema (YAML anchor, defined once). It equals phraseforge's
      # ai.VocabularyItemSchema.
      format: &itemSchema
        type: object
        required: [phrase, translation]
        properties:
          phrase:
            type: string
          grammar:
            type: [string, 'null']
          transcription:
            type: [string, 'null']
          translation:
            type: string
          notes:
            type: [string, 'null']

defaultTest:
  assert:
    - type: is-json
      value: *itemSchema

    - type: javascript
      value: file://assertions/validate-translation.js

tests:
  - file://generate-tests.js