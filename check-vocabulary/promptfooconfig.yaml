description: Check vocabulary, which known phrases need a new example

# Same call shape as phraseforge's check_vocabulary call: one user message
# (prompt/phraseforge/default/system/check-vocabulary.txt, synced to the
# embedded default by scripts/sync-prompts.js), the reply schema sent as
# Ollama's "format". num_ctx equals the purpose's numCtx and the schema equals
# ai.CheckVocabularySchema (npm run check-sync verifies both).
prompts:
  - file://../prompt/phraseforge/default/system/check-vocabulary.txt

providers:
  - id: ollama:chat:gemma4:12b
    label: ollama-gemma4-12b
    config:
      think: false
      num_ctx: 8192
      format: &checkSchema
        type: object
        required: [results]
        properties:
          results:
            type: array
            items:
              type: object
              required: [n, needsExample, needsSense]
              properties:
                n:
                  type: integer
                needsExample:
                  type: boolean
                needsSense:
                  type: boolean

defaultTest:
  assert:
    - type: is-json
      value: *checkSchema

    - type: javascript
      value: file://../lib/promptfoo-check-assert.js

tests:
  - file://generate-tests.js
