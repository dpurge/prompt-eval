description: Review the translation of a text or dialog

# Same call shape as phraseforge's review_translation call: one user message
# (prompt/phraseforge/default/system/review-translation.txt, synced to the embedded
# default by scripts/sync-prompts.js), the reply schema sent as Ollama's
# "format". num_ctx equals the purpose's numCtx and the schema equals
# ai.ReviewTranslationSchema (npm run check-sync verifies both). Run one case with SMOKE=1
# against a local model; change the provider to review with a more capable one.
prompts:
  - file://../prompt/phraseforge/default/system/review-translation.txt

providers:
  - id: ollama:chat:gemma4:12b
    label: ollama-gemma4-12b
    config:
      think: false
      num_ctx: 16384
      format: &schema
        type: object
        required:
          - translations
        properties:
          translations:
            type: array
            items:
              type: object
              required:
                - locale
                - ok
                - suggestion
                - reason
              properties:
                locale:
                  type: string
                ok:
                  type: boolean
                suggestion:
                  type: string
                reason:
                  type: string

defaultTest:
  assert:
    - type: is-json
      value: *schema

tests:
  - description: deu-translation-with-a-slip
    vars:
      sourceLanguage: German
      text: "Der Hund schläft im Garten. Die Kinder spielen mit dem Ball."
      translations: "[en]\nThe dog sleeps in the garden. The children play with the cat.\n\n[pl]\nPies śpi w ogrodzie. Dzieci bawią się piłką."
      vocabulary: "- der Hund = en: dog | pl: pies\n- der Ball = en: ball | pl: piłka"
