# ai.Service.Generate "transcription" calls: Source language is the language
# code, Target language is the fixed sentinel "transcription", content type
# text. reference is the expected pinyin; the check is similarity >= 0.8 on
# letters only (tone marks, spaces and punctuation ignored), plus: no Chinese
# characters left and the same number of lines.
- id: cmn-greeting
  language: cmn
  target: transcription
  smoke: true
  content: 你好，我叫小明。
  reference: Nǐ hǎo, wǒ jiào Xiǎomíng.
- id: cmn-two-lines
  language: cmn
  target: transcription
  smoke: true
  content: |-
    我想点一杯咖啡。
    学生在学校学习。
  reference: |-
    Wǒ xiǎng diǎn yī bēi kāfēi.
    Xuéshēng zài xuéxiào xuéxí.
- id: cmn-weather
  language: cmn
  target: transcription
  content: 今天天气很好。
  reference: Jīntiān tiānqì hěn hǎo.
- id: arb-excerpt
  language: arb
  target: transcription
  smoke: true
  content: |-
    كنت في حالة من الإحباط، أغرق في دوامة من عدم اليقين. لكنني اتخذت في أعماقي قراراً، لن تكون هذه النهاية، مهما اشتدت الصعوبات.
  reference: |-
    Kuntu fī ḥāla min al-iḥbāṭ, aġraqu fī dawwāma min ʿadam al-yaqīn. Lākinnanī ittaḫaḏtu fī aʿmāqī qarāran, lan takūna hāḏihi n-nihāya, mahmā ištaddat aṣ-ṣuʿūbāt.
- id: fas-excerpt
  language: fas
  target: transcription
  content: |-
    شرکت نفتی آرامکو در عربستان سعودی اعلام کرده است که سود این شرکت در سه‌ماههٔ دوم سال ۲۰۲۶ بسیار زیاد شد. این خبر هم‌زمان با تنش‌ها در منطقه و اختلال در کشتیرانی خلیج فارس منتشر شد.
  reference: |-
    Šerkat-e naftī-ye Ārāmkū dar ʿArabestān-e Saʿūdī eʿlām karde ast ke sūd-e īn šerkat dar se-māhe-ye dovvom-e sāl-e 2026 besyār zīyād šod. Īn xabar ham-zamān bā taneš-hā dar manteqe va extelāl dar keštīrānī-ye Xalīj-e Fārs montašer šod.
- id: heb-excerpt
  language: heb
  target: transcription
  content: |-
    בַּבַּיִת יֵשׁ חֶדֶר. הַחֶדֶר בַּבַּיִת.
  reference: |-
    Babayit yeš ḥeder. Haḥeder babayit.
- id: heb-unpointed
  language: heb
  target: transcription
  content: |-
    בבית יש חדר. החדר בבית.
  reference: |-
    Babayit yeš ḥeder. Haḥeder babayit.
- id: jpn-excerpt
