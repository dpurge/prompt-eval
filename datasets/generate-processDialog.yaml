# ai.Service.Generate "process_dialog" calls: Source language is the language
# code, Target language the sentinel "process_dialog", content type dialog.
# turns = how many lines the cleaned dialog must have (one per turn).
- id: deu-merged-turns
  language: deu
  target: process_dialog
  contentType: dialog
  smoke: true
  content: |-
    Impressum | Datenschutz
    Kellnerin: Guten Tag! Was möchten Sie trinken? Gast: Einen Kaffee, bitte. Kellnerin: Gern. Mit Milch? Gast: Nein, danke. Schwarz.
    Werbung: Jetzt Tickets kaufen!
  turns: 4
  keep: ["Was möchten Sie trinken", "Einen Kaffee, bitte", "Mit Milch", "Schwarz"]
  drop: ["Impressum", "Datenschutz", "Tickets"]
- id: spa-dashes
  language: spa
  target: process_dialog
  contentType: dialog
  content: |-
    Menú | Contacto
    —Buenas tardes. ¿Qué desea? —Un café con leche, por favor. —Enseguida.
    Síguenos en Instagram
  turns: 3
  keep: ["Qué desea", "café con leche", "Enseguida"]
  drop: ["Menú", "Instagram"]
- id: cmn-labels
  language: cmn
  target: process_dialog
  contentType: dialog
  smoke: true
  content: |-
    首页 | 联系我们
    甲：你好！乙：你好，请坐。甲：谢谢。
    广告：点击购买
  turns: 3
  keep: ["你好", "请坐", "谢谢"]
  drop: ["首页", "广告", "点击购买"]
- id: deu-lesson-dialog
  language: deu
  target: process_dialog
  contentType: dialog
  smoke: true
  # the lesson's instruction before the dialog and the exercise after it are not part of it
  content: |-
    Startseite | Dialoge
    Dialog 2: Im Café
    Hören Sie den Dialog und sprechen Sie nach.
    A: Guten Tag, ich möchte einen Kaffee.
    B: Gern. Mit Milch?
    A: Ja, bitte.
    B: Das macht zwei Euro.
    Übung: Beantworten Sie die Fragen.
    1. Was bestellt A?
    Weiterlesen: Dialog 3
  turns: 4
  keep: ["ich möchte einen Kaffee", "Mit Milch", "zwei Euro"]
  drop: ["Startseite", "Hören Sie", "Übung", "Was bestellt", "Weiterlesen"]
