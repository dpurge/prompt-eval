- id: spa-mid-article-chunk
  language: spa
  target: process_text
  smoke: true
  # a chunk that starts mid-sentence and has no heading, as produced by the
  # chunked ingest: it must be cleaned like any other text, not dropped as
  # boilerplate, and must not gain an invented heading
  content: |-
    y por eso los vecinos decidieron plantar árboles en la plaza.

    El alcalde agradeció la ayuda de todos y prometió más parques.
  keep: ["vecinos decidieron plantar árboles", "alcalde agradeció la ayuda"]
  drop: []
  forbid: ["^#"]
- id: arb-lesson-page
  language: arb
  target: process_text
  smoke: true
  # an introduction before the text and questions after it are not part of it
  content: |-
    الرئيسية | دروس | اتصل بنا
    الدرس الثالث: القراءة
    في هذا الدرس ستقرأ نصاً قصيراً عن المكتبة وتتعلم كلمات جديدة.
    قبل القراءة: هل تحب المكتبات؟
    افتتحت المدينة مكتبة جديدة أمس. تتسع المكتبة لأكثر من مئة ألف كتاب.
    جاء كثير من الزوار في اليوم الأول.
    أسئلة الفهم:
    ١. متى افتتحت المكتبة؟
    ٢. كم كتاباً تتسع؟
    اقرأ أيضاً: مدن عربية
  keep: ["افتتحت المدينة مكتبة جديدة", "مئة ألف كتاب", "كثير من الزوار"]
  drop: ["الرئيسية", "في هذا الدرس", "قبل القراءة", "أسئلة الفهم", "متى افتتحت", "اقرأ أيضاً"]
