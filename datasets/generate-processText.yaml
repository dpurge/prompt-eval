# ai.Service.Generate "process_text" calls on raw extracted page text: Source
# language is the language code, Target language the sentinel "process_text",
# content type text. keep = sentences that must survive, drop = page
# boilerplate that must go, forbid = patterns the reply must not contain.
- id: deu-news
  language: deu
  target: process_text
  smoke: true
  content: |-
    Startseite | Nachrichten | Sport | Kontakt
    Cookie-Einstellungen akzeptieren
    Berlin eröffnet neue Bibliothek
    Die Stadt Berlin hat gestern eine neue Bibliothek eröffnet. Sie bietet Platz für mehr als 100.000 Bücher.
    Viele Besucher kamen schon am ersten Tag und lasen im Garten.
    Newsletter abonnieren
    Teilen auf Facebook
    © 2026 Beispiel-Zeitung
  keep: ["neue Bibliothek eröffnet", "100.000 Bücher", "lasen im Garten"]
  drop: ["Cookie", "Newsletter", "Facebook", "©", "Startseite"]
- id: spa-news
  language: spa
  target: process_text
  content: |-
    Inicio | Noticias | Deportes | Contacto
    Aceptar cookies
    Abre un nuevo mercado en el centro
    El ayuntamiento abrió ayer un nuevo mercado en el centro de la ciudad. Hay más de cincuenta puestos de fruta y verdura.
    Muchos vecinos fueron a comprar desde la mañana.
    Suscríbete a nuestro boletín
    Compartir en Twitter
    Todos los derechos reservados
  keep: ["nuevo mercado en el centro", "cincuenta puestos", "vecinos fueron a comprar"]
  drop: ["cookies", "boletín", "Twitter", "derechos reservados", "Inicio"]
